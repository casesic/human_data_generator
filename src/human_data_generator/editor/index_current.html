<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>人体数据场景编辑器</title>
<style>
:root{font:14px system-ui;color:#eaf1f2;background:#182329}*{box-sizing:border-box}body{margin:0}
header{padding:14px 18px;background:#243741;font-size:20px}main{display:grid;grid-template-columns:330px 1fr 310px;gap:12px;padding:12px;height:calc(100vh - 55px)}
section{overflow:auto;background:#203039;border:1px solid #36505a;border-radius:8px;padding:12px}h2{font-size:16px;margin:4px 0 12px}
label{display:block;margin:9px 0 4px;color:#b9d4d7}input,select,textarea,button{font:inherit;border-radius:5px;padding:7px;color:#f0f5f5;background:#17262e;border:1px solid #66838b}
input,select,textarea{width:100%}input[type=number]{max-width:150px}input[type=range]{max-width:none}button{cursor:pointer;margin:4px 4px 4px 0;background:#315765}button:hover{background:#3e7182}
.row{display:flex;gap:8px;align-items:center}.row>div{flex:1}.card{border:1px solid #4d6570;padding:9px;border-radius:7px;margin:10px 0}
.muted{color:#aec0c6;font-size:12px}canvas{width:100%;height:100%;background:#596764;border-radius:6px}
#mapPanel{padding:6px;position:relative}#hint{position:absolute;bottom:15px;left:16px;background:#15242bcc;padding:6px;border-radius:4px}
#status{white-space:pre-wrap;min-height:65px;word-break:break-all}img{width:48%;max-height:180px;object-fit:contain;background:#10191d}
</style>
<header>人体数据场景编辑器 <span class="muted">双机 ERP · 人物轨迹 · MAMMA 512 标签</span></header>
<main>
<section><h2>场景</h2>
<label>环境</label><select id="environment"><option value="city">城市路口</option><option value="riverfront">河岸步道</option></select>
<label>场景编号</label><input id="sceneId">
<div class="row"><div><label>种子</label><input id="seed" type="number"></div><div><label>帧率</label><input id="fps" type="number" min="1"></div><div><label>帧数</label><input id="frameCount" type="number" min="1"></div></div>
<h2>人物</h2><div id="people"></div><button id="addPerson">增加人物</button>
<h2>双机组</h2><div id="rigs"></div><button id="addRig">增加机位组</button>
<p class="muted">地图绿色区域是已知道路候选区域，不表示障碍物已完成净空检查。</p>
</section>
<section id="mapPanel"><canvas id="map"></canvas><div id="hint">拖动人物轨迹端点或相机组；滚轮缩放</div></section>
<section><h2>检查与生成</h2>
<label>当前帧 <span id="frameLabel"></span></label><input id="frame" type="range" min="0" value="0">
<label>预览机位组</label><select id="previewRig"></select>
<button id="check">CPU 检查</button><button id="save">保存修订</button>
<div class="row"><input id="loadId" placeholder="场景编号__r1"><button id="load">载入</button></div>
<button id="preview">预览当前帧</button><button id="generate">生成所设帧段</button>
<p class="muted">只有点击预览或生成才会请求 GPU 渲染。视频为可选展示，不影响数据包。</p>
<div id="status"></div><div><img id="cam2"><img id="cam4"></div>
</section></main>
<script>
const $=id=>document.getElementById(id);let scene,map,components={},frame=0,view={x:0,y:80,s:9},drag=null;
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{}),v=await r.json();if(!r.ok)throw Error(v.error||r.status);return v}
function status(x){$('status').textContent=x}
function toScreen(p){let c=$('map');return [c.clientWidth/2+(p[0]-view.x)*view.s,c.clientHeight/2-(p[1]-view.y)*view.s]}
function toWorld(p){let c=$('map');return [view.x+(p[0]-c.clientWidth/2)/view.s,view.y-(p[1]-c.clientHeight/2)/view.s]}
function draw(){if(!scene||!map)return;let c=$('map'),d=devicePixelRatio||1;c.width=c.clientWidth*d;c.height=c.clientHeight*d;let ctx=c.getContext('2d');ctx.scale(d,d);
 ctx.fillStyle='#66716b';ctx.fillRect(0,0,c.clientWidth,c.clientHeight);
 for(const box of map.roads){let a=toScreen([box[0],box[3]]),b=toScreen([box[2],box[1]]);ctx.fillStyle='#548b63';ctx.fillRect(a[0],a[1],b[0]-a[0],b[1]-a[1])}
 for(const p of scene.people){let a=toScreen(p.route_xy_m[0]),b=toScreen(p.route_xy_m.at(-1));ctx.strokeStyle='#ffd47d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(...a);for(const point of p.route_xy_m.slice(1))ctx.lineTo(...toScreen(point));ctx.stroke();
 p.route_xy_m.forEach((point,i)=>{let q=toScreen(point);ctx.fillStyle='#fff0b7';ctx.beginPath();ctx.arc(...q,7,0,7);ctx.fill();ctx.fillStyle='#182329';ctx.fillText('P'+p.person_id+'·'+(i+1),q[0]+8,q[1]-7)})}
 for(const r of scene.rigs){let q=toScreen(r.origin_m);ctx.fillStyle='#7ce6ef';ctx.beginPath();ctx.arc(...q,8,0,7);ctx.fill();ctx.fillText(r.rig_id,q[0]+9,q[1]-9)}
}
function sync(){scene.scene_id=$('sceneId').value;scene.seed=Number($('seed').value);scene.fps=Number($('fps').value);scene.frame_count=Number($('frameCount').value);frame=Math.min(frame,scene.frame_count-1);$('frame').max=scene.frame_count-1;$('frame').value=frame;$('frameLabel').textContent=frame+' / '+(frame/scene.fps).toFixed(2)+' 秒';draw()}
function refresh(){if(!scene)return;$('environment').value=scene.environment;$('sceneId').value=scene.scene_id;$('seed').value=scene.seed;$('fps').value=scene.fps;$('frameCount').value=scene.frame_count;
 $('people').innerHTML='';scene.people.forEach((p,j)=>{let box=document.createElement('div');box.className='card';box.innerHTML='<b>人物 '+p.person_id+'</b> <button data-remove>移除</button>'+
 '<label>人物身体</label><select data-body></select><label>动作</label><select data-motion></select><label>衣物</label><select data-clothing></select><label>发型</label><select data-hair></select><div class="muted" data-compat></div><div class="row"><div><label>动作起始帧</label><input data-start type="number" min="0"></div><div><label>速度 m/s</label><input data-speed type="number" min="0.1" max="4" step="0.1"></div></div>'+
 '<label>路线起点进度 m</label><input data-progress type="number" min="0" step="0.1">'+
 '<label>路线控制点 XY（每行一组，米）</label><textarea data-route rows="3"></textarea>';
 for(const [field,kind] of [['body','bodies'],['motion','motions'],['clothing','clothing'],['hair','hair']]){
   let select=box.querySelector('[data-'+field+']');for(const item of components[kind]){
     let option=new Option(item.id+(item.status==='ready'?'':' · '+item.status),item.id);
     option.disabled=item.status!=='ready';option.title=item.reason||'';select.add(option)}
   select.value=p[field];select.onchange=()=>{p[field]=select.value;details();draw()}}
 function details(){let m=components.motions.find(x=>x.id===p.motion),c=components.clothing.find(x=>x.id===p.clothing);
   box.querySelector('[data-start]').max=m?m.available_frames-1:0;
   let warning=c&&c.kind==='native_locked'?'此衣物仅限 '+c.locked_body+' + '+c.locked_motion+'，源帧 '+c.locked_window.join('–')+'；发型可单独选择。'+(p.body!==c.locked_body||p.motion!==c.locked_motion?'当前组合不受支持。':''):'';
   box.querySelector('[data-compat]').textContent=(m?'动作源帧 '+m.first_source_frame+'–'+m.last_source_frame+'；有效起点 0–'+(m.available_frames-1)+'，实际可用时长还取决于场景帧率和帧数。简单衣物按目标身体重绑；发型按目标头皮转移。':'')+warning}
 details();
 box.querySelector('[data-start]').value=p.motion_start;box.querySelector('[data-speed]').value=p.speed_m_s;box.querySelector('[data-progress]').value=p.start_progress_m;
 box.querySelector('[data-route]').value=p.route_xy_m.map(q=>q.join(', ')).join('\n');
 box.querySelector('[data-start]').onchange=e=>p.motion_start=Number(e.target.value);
 box.querySelector('[data-speed]').onchange=e=>p.speed_m_s=Number(e.target.value);box.querySelector('[data-progress]').onchange=e=>p.start_progress_m=Number(e.target.value);
 box.querySelector('[data-route]').onchange=e=>{p.route_xy_m=e.target.value.trim().split('\n').map(line=>line.split(',').map(Number));draw()};
 box.querySelector('[data-remove]').onclick=()=>{if(scene.people.length<=1)return;scene.people.splice(j,1);refresh()};
 $('people').append(box)});
 $('rigs').innerHTML='';scene.rigs.forEach((r,j)=>{let box=document.createElement('div');box.className='card';box.innerHTML='<b>'+r.rig_id+'</b> <button data-remove>移除</button>'+
 '<div class="row"><div><label>X m</label><input data-x type="number" step=".01"></div><div><label>Y m</label><input data-y type="number" step=".01"></div><div><label>yaw °</label><input data-yaw type="number" step="1"></div></div>';
 for(const [field,value,apply] of [['x',r.origin_m[0],v=>r.origin_m[0]=v],['y',r.origin_m[1],v=>r.origin_m[1]=v],['yaw',r.yaw_deg,v=>r.yaw_deg=v]]){let el=box.querySelector('[data-'+field+']');el.value=value;el.onchange=e=>{apply(Number(e.target.value));draw()}}
 box.querySelector('[data-remove]').onclick=()=>{if(scene.rigs.length<=1)return;scene.rigs.splice(j,1);refresh()};$('rigs').append(box)});
 $('previewRig').replaceChildren(...scene.rigs.map(r=>new Option(r.rig_id,r.rig_id)));sync()}
async function open(environment){scene=await api('/api/example?environment='+environment);map=await api('/api/map?environment='+environment);components=await api('/api/components');view=environment==='city'?{x:0,y:81,s:9}:{x:0,y:2,s:14};frame=0;refresh()}
async function changeEnvironment(environment){scene.environment=environment;map=await api('/api/map?environment='+environment);view=environment==='city'?{x:0,y:81,s:9}:{x:0,y:2,s:14};refresh();status('环境已切换；人物四类组件保留。请检查路线与机位位置。')}
for(const id of ['sceneId','seed','fps','frameCount'])$(id).onchange=sync;
$('frame').oninput=e=>{frame=Number(e.target.value);sync()};$('environment').onchange=e=>changeEnvironment(e.target.value).catch(x=>status(x.message));
$('addPerson').onclick=()=>{let n=Math.max(...scene.people.map(p=>p.person_id))+1,base=scene.people[0];scene.people.push({...structuredClone(base),person_id:n,route_xy_m:base.route_xy_m.map(([x,y])=>[x+n,y])});refresh()};
$('addRig').onclick=()=>{let n=1;while(scene.rigs.some(r=>r.rig_id==='rig_custom_'+n))n++;let r=structuredClone(scene.rigs[0]);r.rig_id='rig_custom_'+n;r.origin_m[0]+=n;scene.rigs.push(r);refresh()};
$('check').onclick=async()=>{try{sync();status(JSON.stringify(await api('/api/check',{scene}),null,2))}catch(e){status(e.message)}};
$('save').onclick=async()=>{try{sync();let x=await api('/api/save',{scene});$('loadId').value=x.id;status('已保存 '+x.path)}catch(e){status(e.message)}};
$('load').onclick=async()=>{try{scene=await api('/api/recipe?id='+encodeURIComponent($('loadId').value));map=await api('/api/map?environment='+scene.environment);refresh();status('已载入')}catch(e){status(e.message)}};
async function start(kind){try{sync();let result=await api('/api/start',{kind,scene,frame,rig_id:$('previewRig').value});status('任务 '+result.task_id+' 已启动');poll(result.task_id)}catch(e){status(e.message)}}
async function poll(id){try{let t=await api('/api/task?id='+id);status(id+' · '+t.state+(t.error?'\n'+t.error:''));if(t.state==='completed'&&t.kind==='preview'){for(const camera of ['cam2','cam4'])$(camera).src='/api/image/'+id+'/'+camera+'?t='+Date.now()}if(!['completed','failed'].includes(t.state))setTimeout(()=>poll(id),1500)}catch(e){status(e.message)}}
$('preview').onclick=()=>start('preview');$('generate').onclick=()=>start('run');
let canvas=$('map');canvas.addEventListener('pointerdown',e=>{let rect=canvas.getBoundingClientRect(),p=[e.clientX-rect.left,e.clientY-rect.top],candidates=[];
 scene.people.forEach(person=>person.route_xy_m.forEach((point,i)=>candidates.push({kind:'point',person,i,point,d:Math.hypot(...toScreen(point).map((v,j)=>v-p[j]))})));
 scene.rigs.forEach(rig=>candidates.push({kind:'rig',rig,d:Math.hypot(...toScreen(rig.origin_m).map((v,j)=>v-p[j]))}));
 candidates.sort((a,b)=>a.d-b.d);drag=candidates[0]?.d<16?candidates[0]:{kind:'pan',p,view:{...view}};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;let rect=canvas.getBoundingClientRect(),p=[e.clientX-rect.left,e.clientY-rect.top],world=toWorld(p);
 if(drag.kind==='point'){drag.person.route_xy_m[drag.i]=world;refresh()}else if(drag.kind==='rig'){drag.rig.origin_m[0]=world[0];drag.rig.origin_m[1]=world[1];refresh()}
 else{view.x=drag.view.x-(p[0]-drag.p[0])/view.s;view.y=drag.view.y+(p[1]-drag.p[1])/view.s;draw()}});
canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('wheel',e=>{e.preventDefault();view.s=Math.max(2,Math.min(40,view.s*(e.deltaY<0?1.15:.87)));draw()},{passive:false});
new ResizeObserver(draw).observe(canvas);open('city').catch(e=>status(e.message));
</script></html>
